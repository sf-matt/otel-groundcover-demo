apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-groundcover-demo-config
data:
  OTEL_SERVICE_NAME: otel-groundcover-demo
  OTEL_EXPORTER_OTLP_ENDPOINT: http://groundcover-sensor.groundcover.svc.cluster.local:4318/v1/traces
  DEPLOYMENT_ENVIRONMENT: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-groundcover-demo
  labels:
    app: otel-groundcover-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-groundcover-demo
  template:
    metadata:
      labels:
        app: otel-groundcover-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          # Kept in sync by the `publish` job in .github/workflows/ci.yml,
          # which commits the new sha tag here after every build. Argo CD's
          # auto-sync then rolls it out — don't hand-edit the tag.
          image: ghcr.io/sf-matt/otel-groundcover-demo:sha-29594bf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: otel-groundcover-demo-config
          env:
            # Kept in sync by the same CI step as the image tag above, with
            # the traceparent that build stamped on the image's
            # `groundcover.traceparent` label. Don't hand-set this with
            # `kubectl set env` — Argo CD's selfHeal reverts it to whatever
            # is committed here within seconds. See README.
            - name: TRACEPARENT
              value: "00-1dc0408b5837284c1737727427495880-f4f677101e5018ae-01"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: otel-groundcover-demo
spec:
  selector:
    app: otel-groundcover-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
