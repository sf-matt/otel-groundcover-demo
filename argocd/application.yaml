apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-groundcover-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sf-matt/otel-groundcover-demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-groundcover-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
