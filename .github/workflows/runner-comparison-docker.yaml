name: Runner Comparison (Docker Build)

on:
  workflow_dispatch:

jobs:
  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: "github-hosted-2404"
          - runner: ubuntu-22.04
            label: "github-hosted-2204"
          - runner: blacksmith-2vcpu-ubuntu-2404
            label: "blacksmith-2vcpu"
    runs-on: ${{ matrix.runner }}
    name: docker-build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push, no commit)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: otel-groundcover-demo:runner-test
          # Deliberately no cache-from/cache-to on this first run, so all
          # three runners start cold and the comparison is fair.
