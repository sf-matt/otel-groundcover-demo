name: Build and Push App

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  semgrep:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Scan source
        run: semgrep scan --config auto --json --output semgrep-results.json
      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: ignore

  iac-scan:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan IaC for misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: .venv,fargate/.terraform
          format: json
          output: trivy-iac-results.json
          severity: CRITICAL,HIGH
      - name: Upload IaC scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-iac-results
          path: trivy-iac-results.json
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Generate deploy traceparent
        id: traceparent
        run: |
          TRACE_ID=$(openssl rand -hex 16)
          SPAN_ID=$(openssl rand -hex 8)
          VALUE="00-${TRACE_ID}-${SPAN_ID}-01"
          echo "$VALUE" > traceparent.txt
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
      - name: Upload deploy traceparent
        uses: actions/upload-artifact@v7
        with:
          name: deploy-traceparent
          path: traceparent.txt
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            groundcover.traceparent=${{ steps.traceparent.outputs.value }}
      - name: Get sha image tag
        id: image_tag
        run: |
          IMAGE_TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -n1)
          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::no sha-tagged image found in metadata-action output"
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Scan image for vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image_tag.outputs.value }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
      - name: Deploy via GitOps
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.value }}"
          sed -i "s#^\( *\)image: ghcr.io/.*/otel-groundcover-demo:.*#\1image: ${IMAGE_TAG}#" k8s/deployment.yaml
          sed -i "/name: TRACEPARENT/{n;s#value: \".*\"#value: \"${{ steps.traceparent.outputs.value }}\"#;}" k8s/deployment.yaml
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "k8s/deployment.yaml already points at ${IMAGE_TAG}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: deploy ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main
