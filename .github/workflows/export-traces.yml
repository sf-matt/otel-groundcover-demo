name: Export CI Traces

on:
  workflow_run:
    workflows: ["Build and Push App"]
    types: [completed]

jobs:
  export-traces:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download deploy traceparent
        id: download-traceparent
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: deploy-traceparent
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read deploy traceparent
        id: traceparent
        if: steps.download-traceparent.outcome == 'success'
        run: echo "value=$(cat traceparent.txt)" >> "$GITHUB_OUTPUT"
      - uses: groundcover-com/groundcover-github-action@v3
        with:
          groundcoverEndpoint: ${{ secrets.GC_ENDPOINT }}
          apiKey: ${{ secrets.GC_API_KEY }}
          runId: ${{ github.event.workflow_run.id }}
          githubToken: ${{ github.token }}
          workload: otel-groundcover-demo
          traceparent: ${{ steps.traceparent.outputs.value }}
